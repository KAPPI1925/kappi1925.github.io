name: Update citation metrics

on:
  schedule:
    - cron: "30 2 * * 1"   # every Monday 02:30 UTC (08:00 IST)
  workflow_dispatch:        # "Run workflow" button in the Actions tab
    inputs:
      mode:
        description: "normal / discover (print response shapes only)"
        default: normal

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch Google Scholar metrics
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SCHOLAR_ID: ${{ vars.SCHOLAR_ID }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "discover" ]; then
            python3 scripts/scholar_discover.py
          else
            python3 scripts/update_metrics.py
          fi
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/metrics.json; then
            echo "No change in metrics."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data/metrics.json
            git commit -m "Update citation metrics"
            git push
          fi
