name: Update citation metrics

on:
  schedule:
    - cron: "30 2 1 * *"   # 1st of every month, 02:30 UTC (08:00 IST)
  workflow_dispatch:        # "Run workflow" button in the Actions tab
    inputs:
      mode:
        description: "normal / details (refresh per-article data now) / discover (print response shapes only)"
        default: normal

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch Google Scholar data
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SCHOLAR_ID: ${{ vars.SCHOLAR_ID }}
          FORCE_DETAILS: ${{ github.event.inputs.mode == 'details' && '1' || '' }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "discover" ]; then
            python3 scripts/scholar_discover.py
          else
            python3 scripts/update_metrics.py
          fi
      - name: Commit if changed
        run: |
          git add -A data/metrics.json data/scholar_details.json data/scholar_links.json 2>/dev/null || git add -A data/
          if git diff --cached --quiet; then
            echo "No change in Scholar data."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Google Scholar data"
            git push
          fi
