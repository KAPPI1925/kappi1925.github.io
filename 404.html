<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Kamalesh Kanna S</title>
  <meta name="description" content="The page you are looking for does not exist.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Font Awesome 6.5.1 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: var(--bg-primary);
      position: relative;
      overflow: hidden;
    }

    .error-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gradient-hero);
      opacity: 0.5;
    }

    .error-content {
      position: relative;
      z-index: 2;
    }

    .error-code {
      font-size: 8rem;
      font-weight: 900;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
    }

    .error-message {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    .error-subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      margin-bottom: 32px;
      max-width: 400px;
    }

    .error-icon {
      font-size: 4rem;
      color: var(--accent);
      margin-bottom: 24px;
      animation: pulseGlow 2s ease-in-out infinite;
    }

    .error-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .orbit-ring {
      position: absolute;
      border: 1px solid var(--border);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.15;
    }

    .orbit-ring:nth-child(1) {
      width: 300px;
      height: 300px;
      animation: orbitSpin 15s linear infinite;
    }

    .orbit-ring:nth-child(2) {
      width: 500px;
      height: 500px;
      animation: orbitSpin 25s linear infinite reverse;
    }

    .orbit-ring:nth-child(3) {
      width: 700px;
      height: 700px;
      animation: orbitSpin 35s linear infinite;
    }

    .orbit-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .orbit-ring:nth-child(1) .orbit-dot { top: 0; left: 50%; transform: translate(-50%, -50%); }
    .orbit-ring:nth-child(2) .orbit-dot { bottom: 10%; right: 5%; }
    .orbit-ring:nth-child(3) .orbit-dot { top: 15%; left: 5%; }

    @media (max-width: 480px) {
      .error-code {
        font-size: 5rem;
      }
      .error-message {
        font-size: 1.2rem;
      }
      .error-actions {
        flex-direction: column;
        align-items: center;
      }
      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="orbit-ring"><div class="orbit-dot"></div></div>
    <div class="orbit-ring"><div class="orbit-dot"></div></div>
    <div class="orbit-ring"><div class="orbit-dot"></div></div>

    <div class="error-content">
      <div class="error-icon"><i class="fas fa-satellite-dish"></i></div>
      <div class="error-code">404</div>
      <h1 class="error-message">Signal Lost in Space</h1>
      <p class="error-subtitle">The page you're looking for has drifted out of orbit. Let's bring you back to the home base.</p>
      <div class="error-actions">
        <a href="./" class="btn btn-primary">
          <i class="fas fa-home"></i> Back to Home
        </a>
        <a href="mailto:kamaleshkanna.skk@gmail.com" class="btn btn-outline">
          <i class="fas fa-envelope"></i> Contact Me
        </a>
      </div>
    </div>
  </div>

  <script>
    // Theme from localStorage
    (function() {
      const theme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</body>
</html>
